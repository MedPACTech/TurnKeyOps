name: Deploy TurnKeyOps (reusable)

on:
  workflow_call:
    inputs:
      environment-name:
        description: GitHub environment containing the target's variables, secrets, and approval rules
        required: true
        type: string
      aspnetcore-environment:
        description: ASPNETCORE_ENVIRONMENT value for the API
        required: true
        type: string
      ship-release-id:
        description: Hubbsly Ship deployment or release identifier
        required: false
        default: automatic-staging
        type: string
      uat-evidence:
        description: UAT record URL or identifier
        required: false
        default: not-required-for-staging
        type: string
      rollback-reference:
        description: Previous healthy run, artifact, or commit used for rollback
        required: false
        default: staging-uses-latest-healthy
        type: string

permissions:
  contents: read
  id-token: write
  actions: read

env:
  CI: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  quality:
    name: Validate release candidate
    uses: ./.github/workflows/quality-gates.yml

  package:
    name: Build immutable deployment artifacts
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Publish API
        run: |
          set -euo pipefail
          dotnet restore api/TurnKeyOps.API.sln --configfile api/nuget.config
          dotnet publish api/TurnKeyOps.API/TurnKeyOps.API.csproj \
            --configuration Release \
            --no-restore \
            --output "$RUNNER_TEMP/api-package"
          find "$RUNNER_TEMP/api-package" -type f \( -name '*.pdb' -o -name '*.xml' \) -delete
          python3 api/scripts/scan-repository-security.py --path "$RUNNER_TEMP/api-package"
          (cd "$RUNNER_TEMP/api-package" && zip -rq "$RUNNER_TEMP/turnkeyops-api.zip" .)
          package_contents="$(unzip -Z1 "$RUNNER_TEMP/turnkeyops-api.zip")"
          grep -Eq '^(\./)?TurnKeyOps\.API\.dll$' <<< "$package_contents"

      - name: Build and package Node application
        working-directory: client
        run: |
          set -euo pipefail
          npm ci
          npm run build
          mkdir -p "$RUNNER_TEMP/web-package"
          cp -R build "$RUNNER_TEMP/web-package/build"
          cp package.json package-lock.json "$RUNNER_TEMP/web-package/"
          (cd "$RUNNER_TEMP/web-package" && npm ci --omit=dev --ignore-scripts)
          test -f "$RUNNER_TEMP/web-package/build/index.js"
          python3 ../api/scripts/scan-repository-security.py --path "$RUNNER_TEMP/web-package"
          (cd "$RUNNER_TEMP/web-package" && zip -rq "$RUNNER_TEMP/turnkeyops-web.zip" .)

      - name: Write artifact manifest
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "commit=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            sha256sum "$RUNNER_TEMP/turnkeyops-api.zip" "$RUNNER_TEMP/turnkeyops-web.zip"
          } | tee "$RUNNER_TEMP/release-manifest.txt"

      - name: Publish immutable release bundle
        uses: actions/upload-artifact@v4
        with:
          name: turnkeyops-release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/turnkeyops-api.zip
            ${{ runner.temp }}/turnkeyops-web.zip
            ${{ runner.temp }}/release-manifest.txt
          if-no-files-found: error
          retention-days: 90

  deploy:
    name: Deploy API and web
    needs: package
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment-name }}
    steps:
      - uses: actions/checkout@v4

      - name: Download immutable release bundle
        uses: actions/download-artifact@v4
        with:
          name: turnkeyops-release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release

      - name: Validate release and environment contract
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          API_WEBAPP_NAME: ${{ vars.API_WEBAPP_NAME }}
          WEB_WEBAPP_NAME: ${{ vars.WEB_WEBAPP_NAME }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          WEB_BASE_URL: ${{ vars.WEB_BASE_URL }}
          SHIP_RELEASE_ID: ${{ inputs.ship-release-id }}
          UAT_EVIDENCE: ${{ inputs.uat-evidence }}
          ROLLBACK_REFERENCE: ${{ inputs.rollback-reference }}
        run: |
          set -euo pipefail
          missing=0
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP API_WEBAPP_NAME WEB_WEBAPP_NAME API_BASE_URL WEB_BASE_URL SHIP_RELEASE_ID UAT_EVIDENCE ROLLBACK_REFERENCE; do
            if [ -z "${!name:-}" ]; then
              echo "Missing deployment contract value: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Sign in to Azure with workload identity federation
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy API package
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          API_WEBAPP_NAME: ${{ vars.API_WEBAPP_NAME }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.aspnetcore-environment }}
        run: |
          set -euo pipefail
          az webapp config appsettings set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$API_WEBAPP_NAME" \
            --settings ASPNETCORE_ENVIRONMENT="$DEPLOYMENT_ENVIRONMENT" \
            --output none
          az webapp deploy \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$API_WEBAPP_NAME" \
            --src-path "$RUNNER_TEMP/release/turnkeyops-api.zip" \
            --type zip \
            --clean true \
            --restart true \
            --track-status true \
            --output json | tee "$RUNNER_TEMP/api-deployment.json"

      - name: Deploy web package
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          WEB_WEBAPP_NAME: ${{ vars.WEB_WEBAPP_NAME }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          set -euo pipefail
          az webapp config set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$WEB_WEBAPP_NAME" \
            --linux-fx-version 'NODE|22-lts' \
            --startup-file 'node build' \
            --output none
          az webapp config appsettings set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$WEB_WEBAPP_NAME" \
            --settings \
              NODE_ENV=production \
              PUBLIC_TKO_API_BASE_URL="$API_BASE_URL" \
              TKO_API_BASE_URL="$API_BASE_URL" \
              PROTOCOL_HEADER=x-forwarded-proto \
              HOST_HEADER=x-forwarded-host \
            --output none
          az webapp deploy \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$WEB_WEBAPP_NAME" \
            --src-path "$RUNNER_TEMP/release/turnkeyops-web.zip" \
            --type zip \
            --clean true \
            --restart true \
            --track-status true \
            --output json | tee "$RUNNER_TEMP/web-deployment.json"

      - name: Run post-deployment smoke checks
        shell: bash
        env:
          SMOKE_API_BASE_URL: ${{ vars.API_BASE_URL }}
          SMOKE_WEB_BASE_URL: ${{ vars.WEB_BASE_URL }}
        run: |
          set -o pipefail
          api/scripts/post-deploy-smoke.sh | tee "$RUNNER_TEMP/post-deploy-smoke.log"

      - name: Publish deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-evidence-${{ inputs.environment-name }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/api-deployment.json
            ${{ runner.temp }}/web-deployment.json
            ${{ runner.temp }}/post-deploy-smoke.log
            ${{ runner.temp }}/release/release-manifest.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Record Hubbsly Ship release identifiers
        if: always()
        shell: bash
        env:
          DEPLOYMENT_ENVIRONMENT_NAME: ${{ inputs.environment-name }}
          SHIP_RELEASE_ID: ${{ inputs.ship-release-id }}
          UAT_EVIDENCE: ${{ inputs.uat-evidence }}
          ROLLBACK_REFERENCE: ${{ inputs.rollback-reference }}
        run: |
          {
            echo '## TurnKeyOps deployment record'
            echo "- Environment: $DEPLOYMENT_ENVIRONMENT_NAME"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- GitHub run: \`${GITHUB_RUN_ID}\` attempt \`${GITHUB_RUN_ATTEMPT}\`"
            echo "- Hubbsly Ship release: \`$SHIP_RELEASE_ID\`"
            echo "- UAT evidence: $UAT_EVIDENCE"
            echo "- Rollback reference: $ROLLBACK_REFERENCE"
          } >> "$GITHUB_STEP_SUMMARY"
