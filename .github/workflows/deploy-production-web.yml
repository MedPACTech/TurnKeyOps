name: Deploy TurnKeyOps - Production Web
run-name: Production Web · ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  actions: read

concurrency:
  group: turnkeyops-deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # Production is main-only. The condition is structural, so a non-main
    # dispatch cannot acquire Azure credentials or enter the reusable workflow.
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      environment-name: production
      aspnetcore-environment: Production
      component: web
