name: Deploy TurnKeyOps - Staging

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  actions: read

concurrency:
  group: turnkeyops-deploy-staging
  cancel-in-progress: false

jobs:
  guard:
    name: Require main
    runs-on: ubuntu-latest
    steps:
      - name: Reject non-main deployment
        run: |
          if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
            echo 'Staging deployments must run from main.'
            exit 1
          fi

  deploy:
    needs: guard
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      environment-name: staging
      aspnetcore-environment: Staging
      ship-release-id: automatic-staging-${{ github.run_id }}
