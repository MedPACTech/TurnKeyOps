parameters:
- name: environmentName
  type: string
- name: buildConfiguration
  type: string
  default: 'Debug'
- name: webAppName
  type: string
- name: azureSubscription
  type: string
- name: resourceGroupName
  type: string
- name: deployBranchPrimary
  type: string
- name: deployBranchSecondary
  type: string
  default: ''
- name: nugetServiceConnection
  type: string
  default: ''

stages:
- stage: Build_Test_Publish
  displayName: 'Build, Test, Publish'
  jobs:
  - job: BuildTestPublish
    displayName: 'Restore, Build, Test, Publish'
    pool:
      vmImage: 'ubuntu-latest'
    variables:
      SOLUTION_FILE: '**/MedInsights.API.sln'
      API_PROJECT_FILE: 'MedInsights.API/MedInsights.API.csproj'
      PUBLISH_DIR: '$(Build.ArtifactStagingDirectory)/publish'
      DEPLOY_ZIP: '$(Build.ArtifactStagingDirectory)/app.zip'
    steps:
    - ${{ if ne(parameters.nugetServiceConnection, '') }}:
      - task: NuGetAuthenticate@1
        displayName: 'Authenticate Private NuGet Feeds'
        inputs:
          nuGetServiceConnections: '${{ parameters.nugetServiceConnection }}'

    - task: UseDotNet@2
      inputs:
        packageType: 'sdk'
        version: '10.x'
        includePreviewVersions: true
        installationPath: $(Agent.ToolsDirectory)/dotnet

    - task: DotNetCoreCLI@2
      displayName: 'Restore NuGet Packages'
      inputs:
        command: 'restore'
        projects: '$(Build.SourcesDirectory)/$(SOLUTION_FILE)'
        feedsToUse: 'config'
        nugetConfigPath: '$(Build.SourcesDirectory)/nuget.config'

    - task: DotNetCoreCLI@2
      displayName: 'Build Project'
      inputs:
        command: 'build'
        projects: '$(SOLUTION_FILE)'
        arguments: '--configuration ${{ parameters.buildConfiguration }}'

    - task: DotNetCoreCLI@2
      displayName: 'Run Automated Tests'
      inputs:
        command: 'test'
        projects: '$(SOLUTION_FILE)'
        arguments: '--configuration ${{ parameters.buildConfiguration }} --no-build'

    - task: DotNetCoreCLI@2
      displayName: 'Publish Project'
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: '$(API_PROJECT_FILE)'
        arguments: '--configuration ${{ parameters.buildConfiguration }} --output $(PUBLISH_DIR)'
        zipAfterPublish: false
        modifyOutputPath: false

    - script: |
        set -euo pipefail
        echo "Removing non-runtime publish artifacts to reduce zip size..."
        find "$(PUBLISH_DIR)" -type f \( -name '*.pdb' -o -name '*.xml' \) -print -delete || true
      displayName: 'Trim Publish Output'

    - script: |
        set -euo pipefail
        if [ -f "$(PUBLISH_DIR)/publish.zip" ]; then
          echo "ERROR: DotNet publish produced nested publish.zip in $(PUBLISH_DIR)."
          echo "Expected raw publish files (web.config, MedInsights.API.dll, etc)."
          exit 1
        fi
        rm -f "$(DEPLOY_ZIP)"
        cd "$(PUBLISH_DIR)"
        zip -rq "$(DEPLOY_ZIP)" .
      displayName: 'Archive Publish Output'

    - script: |
        set -euo pipefail
        echo "Zip package details:"
        ls -lh "$(DEPLOY_ZIP)"
        echo ""
        echo "Top entries:"
        unzip -l "$(DEPLOY_ZIP)" | sed -n '1,40p'
      displayName: 'Validate Deploy Zip'

    - script: |
        set -euo pipefail
        ZIP_PATH="$(DEPLOY_ZIP)"
        CONTENTS="$(unzip -Z1 "$ZIP_PATH")"

        echo "Validating deploy package structure..."

        if ! echo "$CONTENTS" | grep -Eq '^(\./)?web\.config$'; then
          echo "ERROR: web.config not found at package root."
          echo "Top package entries:"
          echo "$CONTENTS" | head -n 80
          exit 1
        fi

        if ! echo "$CONTENTS" | grep -Eq '^(\./)?MedInsights\.API\.dll$'; then
          echo "ERROR: MedInsights.API.dll not found at package root."
          echo "Top package entries:"
          echo "$CONTENTS" | head -n 80
          exit 1
        fi

        if echo "$CONTENTS" | grep -qx 'publish.zip'; then
          echo "ERROR: Found publish.zip at package root; nested zip deploy artifact is invalid."
          exit 1
        fi

        echo "Deploy package structure is valid."
      displayName: 'Assert Deploy Package Layout'

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Artifact: drop'
      inputs:
        PathtoPublish: '$(DEPLOY_ZIP)'
        ArtifactName: 'drop'

- stage: Deploy
  displayName: 'Deploy'
  dependsOn: Build_Test_Publish
  condition: and(succeeded(), or(eq(variables['Build.SourceBranch'], 'refs/heads/${{ parameters.deployBranchPrimary }}'), and(ne('${{ parameters.deployBranchSecondary }}', ''), eq(variables['Build.SourceBranch'], 'refs/heads/${{ parameters.deployBranchSecondary }}'))))
  jobs:
  - job: DeployWebApp
    displayName: 'Deploy to ${{ parameters.environmentName }}'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: DownloadBuildArtifacts@0
      displayName: 'Download Artifact: drop'
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'drop'
        downloadPath: '$(Pipeline.Workspace)'

    - task: AzureCLI@2
      displayName: 'Zip Deploy Web App'
      inputs:
        azureSubscription: '${{ parameters.azureSubscription }}'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -euo pipefail
          ZIP_PATH="$(Pipeline.Workspace)/drop/app.zip"
          APP_NAME='${{ parameters.webAppName }}'
          RG_NAME='${{ parameters.resourceGroupName }}'

          echo "Deploying: $ZIP_PATH"
          echo "Target: $RG_NAME / $APP_NAME"

          az webapp config appsettings set \
            --resource-group "$RG_NAME" \
            --name "$APP_NAME" \
            --settings ASPNETCORE_ENVIRONMENT='${{ parameters.environmentName }}' \
            --output table

          az webapp deploy \
            --resource-group "$RG_NAME" \
            --name "$APP_NAME" \
            --src-path "$ZIP_PATH" \
            --type zip \
            --clean true \
            --restart true \
            --track-status true \
            --output json

