parameters:
- name: environmentName
  type: string
- name: appDirectory
  type: string
- name: artifactName
  type: string
- name: azureSubscription
  type: string
- name: webAppName
  type: string
- name: resourceGroupName
  type: string
- name: apiBaseUrl
  type: string
- name: deployBranch
  type: string
  default: 'main'
- name: deployTagPrefix
  type: string
  default: ''
- name: requireManualApproval
  type: boolean
  default: false
- name: smokeApiBaseUrl
  type: string
  default: ''
- name: smokeWebBaseUrl
  type: string
  default: ''

stages:
- stage: Build_Test_Publish
  displayName: 'Build, Check, Publish TurnKeyOps Web'
  jobs:
  - job: BuildClient
    displayName: 'Build SvelteKit Node application'
    pool:
      vmImage: 'ubuntu-latest'
    variables:
      APP_ROOT: '$(Build.SourcesDirectory)/${{ parameters.appDirectory }}'
      PACKAGE_ROOT: '$(Build.ArtifactStagingDirectory)/${{ parameters.artifactName }}'
    steps:
    - bash: api/scripts/scan-repository-security.py
      displayName: 'Scan tracked secrets and PII'
      workingDirectory: '$(Build.SourcesDirectory)'

    - task: NodeTool@0
      displayName: 'Use Node.js 22'
      inputs:
        versionSpec: '22.x'

    - script: npm ci
      displayName: 'Install dependencies'
      workingDirectory: '$(APP_ROOT)'

    - script: npm run check
      displayName: 'Run Svelte checks'
      workingDirectory: '$(APP_ROOT)'

    - script: npm run build
      displayName: 'Build Node application'
      workingDirectory: '$(APP_ROOT)'

    - bash: |
        set -euo pipefail
        mkdir -p "$(PACKAGE_ROOT)"
        cp -R "$(APP_ROOT)/build" "$(PACKAGE_ROOT)/build"
        cp "$(APP_ROOT)/package.json" "$(PACKAGE_ROOT)/package.json"
        cp "$(APP_ROOT)/package-lock.json" "$(PACKAGE_ROOT)/package-lock.json"
        cd "$(PACKAGE_ROOT)"
        npm ci --omit=dev
        test -f build/index.js
      displayName: 'Assemble deployable Node package'

    - bash: api/scripts/scan-repository-security.py --path "$(PACKAGE_ROOT)"
      displayName: 'Inspect production artifact for secrets and PII'
      workingDirectory: '$(Build.SourcesDirectory)'

    - task: ArchiveFiles@2
      displayName: 'Archive TurnKeyOps web'
      inputs:
        rootFolderOrFile: '$(PACKAGE_ROOT)'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/${{ parameters.artifactName }}.zip'
        replaceExistingArchive: true

    - task: PublishPipelineArtifact@1
      displayName: 'Publish BDR client artifact'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/${{ parameters.artifactName }}.zip'
        artifact: '${{ parameters.artifactName }}'

- ${{ if eq(parameters.requireManualApproval, true) }}:
  - stage: UAT_Approval
    displayName: 'UAT signoff and release approval'
    dependsOn: Build_Test_Publish
    condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/${{ parameters.deployTagPrefix }}'))
    jobs:
    - job: WaitForApproval
      displayName: 'Validate UAT evidence and approve release'
      pool: server
      timeoutInMinutes: 4320
      steps:
      - task: ManualValidation@0
        timeoutInMinutes: 1440
        inputs:
          notifyUsers: '$(RELEASE_APPROVERS)'
          instructions: |
            Verify the release tag SHA, required PR validation run, staging/UAT signoff, rollback artifact, and both-brand authorization evidence described in docs/release-readiness.md.
          onTimeout: 'reject'

- stage: Deploy
  displayName: 'Deploy TurnKeyOps Web'
  dependsOn:
  - Build_Test_Publish
  - ${{ if eq(parameters.requireManualApproval, true) }}:
    - UAT_Approval
  condition: and(succeeded(), or(eq(variables['Build.SourceBranch'], 'refs/heads/${{ parameters.deployBranch }}'), and(ne('${{ parameters.deployTagPrefix }}', ''), startsWith(variables['Build.SourceBranch'], 'refs/tags/${{ parameters.deployTagPrefix }}'))))
  jobs:
  - deployment: DeployClient
    displayName: 'Deploy to Azure App Service'
    environment: '${{ parameters.environmentName }}'
    pool:
      vmImage: 'ubuntu-latest'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: DownloadPipelineArtifact@2
            displayName: 'Download BDR client artifact'
            inputs:
              artifact: '${{ parameters.artifactName }}'
              path: '$(Pipeline.Workspace)/${{ parameters.artifactName }}'

          - task: AzureWebApp@1
            displayName: 'Deploy TurnKeyOps web package'
            inputs:
              azureSubscription: '${{ parameters.azureSubscription }}'
              appType: 'webAppLinux'
              appName: '${{ parameters.webAppName }}'
              package: '$(Pipeline.Workspace)/${{ parameters.artifactName }}/${{ parameters.artifactName }}.zip'
              runtimeStack: 'NODE|22-lts'
              startUpCommand: 'node build'

          - task: AzureCLI@2
            displayName: 'Configure TurnKeyOps web runtime'
            inputs:
              azureSubscription: '${{ parameters.azureSubscription }}'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -euo pipefail
                az webapp config appsettings set \
                  --resource-group '${{ parameters.resourceGroupName }}' \
                  --name '${{ parameters.webAppName }}' \
                  --settings \
                    NODE_ENV='production' \
                    PUBLIC_TKO_API_BASE_URL='${{ parameters.apiBaseUrl }}' \
                    TKO_API_BASE_URL='${{ parameters.apiBaseUrl }}' \
                    PROTOCOL_HEADER='x-forwarded-proto' \
                    HOST_HEADER='x-forwarded-host' \
                  --output table

                az webapp restart \
                  --resource-group '${{ parameters.resourceGroupName }}' \
                  --name '${{ parameters.webAppName }}'

- ${{ if and(ne(parameters.smokeApiBaseUrl, ''), ne(parameters.smokeWebBaseUrl, '')) }}:
  - stage: Post_Deploy_Smoke
    displayName: 'Post-deploy smoke and evidence'
    dependsOn: Deploy
    condition: succeeded()
    jobs:
    - job: Smoke
      pool:
        vmImage: 'ubuntu-latest'
      steps:
      - checkout: self
      - bash: |
          set -o pipefail
          api/scripts/post-deploy-smoke.sh | tee "$(Build.ArtifactStagingDirectory)/post-deploy-smoke.log"
        displayName: 'Verify public and authorization paths'
        env:
          SMOKE_API_BASE_URL: '${{ parameters.smokeApiBaseUrl }}'
          SMOKE_WEB_BASE_URL: '${{ parameters.smokeWebBaseUrl }}'
      - publish: '$(Build.ArtifactStagingDirectory)/post-deploy-smoke.log'
        artifact: 'post-deploy-smoke'
        condition: always()
