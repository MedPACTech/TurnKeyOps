parameters:
- name: environmentName
  type: string
- name: appDirectory
  type: string
- name: artifactName
  type: string
- name: azureSubscription
  type: string
- name: webAppName
  type: string
- name: deployBranch
  type: string
  default: 'main'

stages:
- stage: Build_Test_Publish
  displayName: 'Build, Check, Publish BDR Client'
  jobs:
  - job: BuildClient
    displayName: 'Build SvelteKit Node application'
    pool:
      vmImage: 'ubuntu-latest'
    variables:
      APP_ROOT: '$(Build.SourcesDirectory)/${{ parameters.appDirectory }}'
      PACKAGE_ROOT: '$(Build.ArtifactStagingDirectory)/${{ parameters.artifactName }}'
    steps:
    - task: NodeTool@0
      displayName: 'Use Node.js 22'
      inputs:
        versionSpec: '22.x'

    - script: npm ci
      displayName: 'Install dependencies'
      workingDirectory: '$(APP_ROOT)'

    - script: npm run check
      displayName: 'Run Svelte checks'
      workingDirectory: '$(APP_ROOT)'

    - script: npm run build
      displayName: 'Build Node application'
      workingDirectory: '$(APP_ROOT)'

    - bash: |
        set -euo pipefail
        mkdir -p "$(PACKAGE_ROOT)"
        cp -R "$(APP_ROOT)/build" "$(PACKAGE_ROOT)/build"
        cp "$(APP_ROOT)/package.json" "$(PACKAGE_ROOT)/package.json"
        cp "$(APP_ROOT)/package-lock.json" "$(PACKAGE_ROOT)/package-lock.json"
        cd "$(PACKAGE_ROOT)"
        npm ci --omit=dev
        test -f build/index.js
      displayName: 'Assemble deployable Node package'

    - task: ArchiveFiles@2
      displayName: 'Archive BDR client'
      inputs:
        rootFolderOrFile: '$(PACKAGE_ROOT)'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/${{ parameters.artifactName }}.zip'
        replaceExistingArchive: true

    - task: PublishPipelineArtifact@1
      displayName: 'Publish BDR client artifact'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/${{ parameters.artifactName }}.zip'
        artifact: '${{ parameters.artifactName }}'

- stage: Deploy
  displayName: 'Deploy BDR Client'
  dependsOn: Build_Test_Publish
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/${{ parameters.deployBranch }}'))
  jobs:
  - deployment: DeployClient
    displayName: 'Deploy to Azure App Service'
    environment: '${{ parameters.environmentName }}'
    pool:
      vmImage: 'ubuntu-latest'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: DownloadPipelineArtifact@2
            displayName: 'Download BDR client artifact'
            inputs:
              artifact: '${{ parameters.artifactName }}'
              path: '$(Pipeline.Workspace)/${{ parameters.artifactName }}'

          - task: AzureWebApp@1
            displayName: 'Deploy BDR client package'
            inputs:
              azureSubscription: '${{ parameters.azureSubscription }}'
              appType: 'webAppLinux'
              appName: '${{ parameters.webAppName }}'
              package: '$(Pipeline.Workspace)/${{ parameters.artifactName }}/${{ parameters.artifactName }}.zip'
              runtimeStack: 'NODE|22-lts'
              startUpCommand: 'node build'
