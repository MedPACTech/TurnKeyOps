parameters:
- name: environmentName
  type: string
- name: appDirectory
  type: string
- name: artifactName
  type: string
- name: deploymentToken
  type: string
- name: deployBranch
  type: string
  default: 'main'

stages:
- stage: Build_Test_Publish
  displayName: 'Build, Check, Publish BDR Admin'
  jobs:
  - job: BuildAdmin
    displayName: 'Build static Svelte application'
    pool:
      vmImage: 'ubuntu-latest'
    variables:
      APP_ROOT: '$(Build.SourcesDirectory)/${{ parameters.appDirectory }}'
    steps:
    - task: NodeTool@0
      displayName: 'Use Node.js 22'
      inputs:
        versionSpec: '22.x'

    - script: npm ci
      displayName: 'Install dependencies'
      workingDirectory: '$(APP_ROOT)'

    - script: npm run check
      displayName: 'Run Svelte checks'
      workingDirectory: '$(APP_ROOT)'

    - script: npm run build
      displayName: 'Build static application'
      workingDirectory: '$(APP_ROOT)'

    - bash: |
        set -euo pipefail
        test -f "$(APP_ROOT)/build/index.html"
        test -f "$(APP_ROOT)/build/staticwebapp.config.json"
      displayName: 'Validate static artifact'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish BDR admin artifact'
      inputs:
        targetPath: '$(APP_ROOT)/build'
        artifact: '${{ parameters.artifactName }}'

- stage: Deploy
  displayName: 'Deploy BDR Admin'
  dependsOn: Build_Test_Publish
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/${{ parameters.deployBranch }}'))
  jobs:
  - deployment: DeployAdmin
    displayName: 'Deploy to Azure Static Web Apps'
    environment: '${{ parameters.environmentName }}'
    pool:
      vmImage: 'ubuntu-latest'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: DownloadPipelineArtifact@2
            displayName: 'Download BDR admin artifact'
            inputs:
              artifact: '${{ parameters.artifactName }}'
              path: '$(System.DefaultWorkingDirectory)/${{ parameters.artifactName }}-deploy'

          - task: AzureStaticWebApp@0
            displayName: 'Deploy BDR admin static site'
            inputs:
              app_location: '/${{ parameters.artifactName }}-deploy'
              skip_app_build: true
              skip_api_build: true
              azure_static_web_apps_api_token: '${{ parameters.deploymentToken }}'
