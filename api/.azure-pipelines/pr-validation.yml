trigger:
  batch: true
  branches:
    include:
    - main

pr:
  autoCancel: true
  branches:
    include:
    - main

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  CI: 'true'

stages:
- stage: Required_Validation
  displayName: 'Required PR validation'
  jobs:
  - job: RepositorySecurity
    displayName: 'Secrets and repository policy'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: self
      fetchDepth: 0
    - bash: python3 api/scripts/scan-repository-security.py
      displayName: 'Reject tracked secrets and PII'
    - bash: git diff --check HEAD~1 HEAD
      displayName: 'Reject whitespace and conflict artifacts'

  - job: Api
    displayName: 'API build, tests, dependencies'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: UseDotNet@2
      inputs:
        packageType: 'sdk'
        version: '10.x'
        includePreviewVersions: true
    - task: DotNetCoreCLI@2
      displayName: 'Restore API'
      inputs:
        command: 'restore'
        projects: 'api/TurnKeyOps.API.sln'
        feedsToUse: 'config'
        nugetConfigPath: 'nuget.config'
    - bash: |
        set -euo pipefail
        dotnet list api/TurnKeyOps.API.sln package --vulnerable --include-transitive | tee "$(Build.ArtifactStagingDirectory)/dotnet-vulnerabilities.txt"
        if grep -q 'has the following vulnerable packages' "$(Build.ArtifactStagingDirectory)/dotnet-vulnerabilities.txt"; then
          echo 'High-confidence .NET dependency findings must be resolved before merge.'
          exit 1
        fi
      displayName: 'Reject vulnerable .NET dependencies'
    - task: DotNetCoreCLI@2
      displayName: 'Build API'
      inputs:
        command: 'build'
        projects: 'api/TurnKeyOps.API.sln'
        arguments: '--configuration Release --no-restore'
    - task: DotNetCoreCLI@2
      displayName: 'Run API tests'
      inputs:
        command: 'test'
        projects: 'api/TurnKeyOps.API.sln'
        arguments: '--configuration Release --no-build --logger trx --results-directory $(Agent.TempDirectory)/api-tests'
        publishTestResults: false
    - task: PublishTestResults@2
      condition: always()
      inputs:
        testResultsFormat: 'VSTest'
        testResultsFiles: '$(Agent.TempDirectory)/api-tests/*.trx'
        testRunTitle: 'TurnKeyOps API'
        failTaskOnFailedTests: true
        failTaskOnMissingResultsFile: true
    - publish: '$(Build.ArtifactStagingDirectory)/dotnet-vulnerabilities.txt'
      artifact: 'api-dependency-evidence'
      condition: always()

  - job: Client
    displayName: 'SvelteKit client checks'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '22.x'
    - bash: npm ci
      workingDirectory: client
      displayName: 'Install locked client dependencies'
    - bash: npm audit --audit-level=high
      workingDirectory: client
      displayName: 'Reject high-severity client dependencies'
    - bash: npm run check
      workingDirectory: client
      displayName: 'Run Svelte diagnostics'
    - bash: npm run test:session
      workingDirectory: client
      displayName: 'Run authorization policy tests'
    - bash: npm run build
      workingDirectory: client
      displayName: 'Build production client'

  - job: LegacyAdmin
    displayName: 'Legacy admin checks'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '22.x'
    - bash: npm ci
      workingDirectory: admin
      displayName: 'Install locked admin dependencies'
    - bash: npm audit --audit-level=high
      workingDirectory: admin
      displayName: 'Reject high-severity admin dependencies'
    - bash: npm run check
      workingDirectory: admin
      displayName: 'Run legacy admin diagnostics'
    - bash: npm run build
      workingDirectory: admin
      displayName: 'Build legacy admin'

  - job: CriticalE2E
    displayName: 'Azurite browser E2E and accessibility'
    dependsOn:
    - Api
    - Client
    - LegacyAdmin
    - RepositorySecurity
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: UseDotNet@2
      inputs:
        packageType: 'sdk'
        version: '10.x'
        includePreviewVersions: true
    - task: NodeTool@0
      inputs:
        versionSpec: '22.x'
    - bash: dotnet restore api/TurnKeyOps.API.sln --configfile nuget.config
      displayName: 'Restore API for E2E host'
    - bash: npm ci
      workingDirectory: client
      displayName: 'Install locked E2E dependencies'
    - bash: npm install --global azurite
      displayName: 'Install Azurite emulator'
    - bash: npx playwright install --with-deps chromium
      workingDirectory: client
      displayName: 'Install Chromium'
    - bash: npm run test:e2e
      workingDirectory: client
      displayName: 'Run critical browser journeys'
      env:
        CI: 'true'
    - task: PublishTestResults@2
      condition: always()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: 'client/test-results/e2e-results.xml'
        testRunTitle: 'TurnKeyOps critical browser E2E'
        failTaskOnFailedTests: true
        failTaskOnMissingResultsFile: true
    - task: PublishPipelineArtifact@1
      condition: always()
      inputs:
        targetPath: 'client/test-results'
        artifact: 'critical-e2e-evidence'

